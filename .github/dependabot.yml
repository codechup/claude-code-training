version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      # @astrojs/check declares a peer range TypeScript 7 does not satisfy, so the
      # bump cannot install. Revisit when @astrojs/check supports it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm-deps: { patterns: ['*'] }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ['*'] }
    open-pull-requests-limit: 2
