name: Links (weekly full sweep)

on:
  schedule:
    - cron: '17 6 * * 1' # every Monday at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: full-repo link sweep
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lychee (full repo)
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --verbose
            './content/**/*.mdx' './docs/**/*.md' './research/**/*.md' './*.md'
          fail: false
          failIfEmpty: false
          output: lychee/out.md

      - name: Open an issue on failure
        if: steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Weekly link sweep found broken links ($(date -u +%Y-%m-%d))" \
            --body-file lychee/out.md
