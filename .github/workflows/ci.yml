name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    secrets:
      HYGIENE_EXTRA_PATTERNS:
        description: 'Extra regex patterns (private project names/hosts), "|||"-joined — see .claude/rules/public-hygiene.md'
        required: false

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans git history, not just the working tree

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (eslint + prettier + no-inline-script guard)
        run: npm run lint
        env:
          HYGIENE_EXTRA_PATTERNS: ${{ secrets.HYGIENE_EXTRA_PATTERNS }}

      - name: Public-repo hygiene guard
        run: node scripts/check-public-hygiene.mjs
        env:
          HYGIENE_EXTRA_PATTERNS: ${{ secrets.HYGIENE_EXTRA_PATTERNS }}

      - name: Design-token guard (no raw colors outside tokens.css)
        run: node scripts/check-raw-colors.mjs

      - name: Plan tool self-check
        run: node tools/plan/cli.ts check

      - name: Content gate (EN/TR parity, schema, code-fence languages)
        run: node scripts/content-gate.ts

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Unit tests (coverage >= 70% lines on src/lib, tools/plan, scripts)
        run: npm test -- --coverage.thresholds.lines=70

      - name: Build
        run: npm run build

      - name: Assert the P01 stub pages built
        run: |
          test -f dist/en/index.html
          test -f dist/tr/index.html
          test -f dist/design/index.html

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: dist
          if-no-files-found: error

  e2e:
    name: e2e
    needs: quality
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: dist

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (a11y + shell + lesson + search specs)
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  links:
    name: links
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: List changed content/docs/research files
        id: changed
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- content docs research | tr '\n' ' ')
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: lychee (changed files only)
        if: steps.changed.outputs.files != ''
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --verbose ${{ steps.changed.outputs.files }}
          fail: true
          failIfEmpty: false

  lighthouse:
    name: lighthouse
    needs: quality
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: dist

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: lighthouserc.json
