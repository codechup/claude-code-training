# gitleaks — public-repository hygiene (CI). Extends the default ruleset with generic project rules
# that mirror scripts/check-public-hygiene.mjs. Project-specific private names are NOT listed here
# (they are supplied to the hygiene script out-of-band). See .claude/rules/public-hygiene.md.
title = "claude-code-training"

[extend]
useDefault = true

[[rules]]
id = "hosting-ipv4"
description = "IPv4 address (hosting IPs never belong in a public repo)"
regex = '''\b(?!127\.0\.0\.1|0\.0\.0\.0|10\.0\.0\.|192\.168\.)(?:\d{1,3}\.){3}\d{1,3}\b'''

[[rules]]
id = "host-opt-path"
description = "absolute host path under /opt (deploy target comes from the DEPLOY_PATH secret)"
regex = '''/opt/[a-z0-9_-]+/[a-z0-9_./-]*'''

[allowlist]
description = "files that describe the patterns themselves"
paths = [
  '''scripts/check-public-hygiene(\.test)?\.(mjs|ts)''',
  '''\.claude/hooks/guard-hygiene\.mjs''',
  '''\.claude/rules/public-hygiene\.md''',
  '''\.gitleaks\.toml''',
  '''package-lock\.json''',
]
